<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; }
    textarea { font-family: inherit; }
    textarea::placeholder { color: rgba(255,255,255,0.3); }
  </style>
</helmet>
<div style="width:390px;height:844px;background:#12201e;color:rgba(255,255,255,0.92);font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;display:flex;flex-direction:column;overflow:hidden;position:relative;">

  <div style="padding:64px 24px 0 24px;flex:1;min-height:0;overflow-y:auto;">

    <div style="font-size:12px;font-weight:700;letter-spacing:0.6px;color:{{accent}};text-transform:uppercase;">Session complete &middot; 20 min</div>
    <div style="font-size:24px;font-weight:600;letter-spacing:-0.3px;margin-top:10px;">How do you feel?</div>

    <div style="display:flex;gap:8px;margin-top:16px;">
      <sc-for list="{{moods}}" as="m" hint-placeholder-count="3">
        <div onClick="{{m.pick}}" style="flex:1;text-align:center;padding:12px 0;border-radius:12px;background:{{m.bg}};color:{{m.color}};border:1px solid {{m.borderColor}};font-size:13.5px;font-weight:600;cursor:pointer;">{{m.label}}</div>
      </sc-for>
    </div>

    <div style="font-size:19px;font-weight:600;margin-top:30px;">How distracted was your mind?</div>
    <div style="display:flex;gap:8px;margin-top:16px;">
      <sc-for list="{{distractions}}" as="d" hint-placeholder-count="3">
        <div onClick="{{d.pick}}" style="flex:1;text-align:center;padding:12px 0;border-radius:12px;background:{{d.bg}};color:{{d.color}};border:1px solid {{d.borderColor}};font-size:13.5px;font-weight:600;cursor:pointer;">{{d.label}}</div>
      </sc-for>
    </div>

    <div style="font-size:12px;font-weight:700;letter-spacing:0.6px;color:rgba(255,255,255,0.4);text-transform:uppercase;margin-top:30px;">Note &middot; optional</div>
    <textarea placeholder="Anything you noticed..." style="width:100%;height:70px;margin-top:10px;padding:12px 14px;border-radius:12px;background:#1c2e2b;border:1px solid #2c3f3c;color:rgba(255,255,255,0.85);font-size:14px;resize:none;outline:none;"></textarea>

  </div>

  <div style="padding:14px 24px 26px 24px;">
    <div style="padding:15px 0;border-radius:16px;background:{{doneBg}};color:{{doneColor}};text-align:center;font-size:15px;font-weight:700;letter-spacing:0.2px;cursor:pointer;">Done</div>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{"accent":{"editor":"color","default":"#4fd1a5","options":["#4fd1a5","#7dd3fc","#f0abfc","#fbbf24"]}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { mood: null, distraction: null };
  }
  renderVals() {
    const accent = this.props.accent ?? '#4fd1a5';
    const buildPills = (labels, key) => labels.map((label) => {
      const selected = this.state[key] === label;
      return {
        label,
        pick: () => this.setState({ [key]: label }),
        bg: selected ? accent : 'rgba(255,255,255,0.06)',
        color: selected ? '#0b1a17' : 'rgba(255,255,255,0.85)',
        borderColor: selected ? accent : 'rgba(255,255,255,0.12)',
      };
    });
    const moods = buildPills(['Calm', 'Neutral', 'Stressed'], 'mood');
    const distractions = buildPills(['Low', 'Medium', 'High'], 'distraction');
    const ready = !!this.state.mood;
    return {
      accent,
      moods,
      distractions,
      doneBg: ready ? accent : 'rgba(255,255,255,0.08)',
      doneColor: ready ? '#0b1a17' : 'rgba(255,255,255,0.35)',
    };
  }
}
</script>
</body>
</html>
